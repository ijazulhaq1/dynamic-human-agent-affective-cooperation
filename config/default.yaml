# config/default.yaml — frozen numeric defaults (spec §20.10).
#
# Every threshold, weight and mapping here is copied verbatim from the frozen
# pre-implementation specification. Code and this file must never drift apart:
# services read these values, they never hardcode a duplicate. Changing a
# number here is a specification revision (§19.11/§20.20), not a config tweak.

# Deterministic evidence -> confidence map (§20.3). c_t = confidence_map[evidence_strength],
# NEVER a function of H_t's own field values.
confidence_map:
  EXPLICIT: 0.85
  STRONG_INDIRECT: 0.70
  WEAK_INDIRECT: 0.55
  CONTRADICTORY: 0.40
  INSUFFICIENT: 0.30

# StateTransitionEngine (M5, §9.1/§20.6).
transition:
  # DYNAMIC's persistence weight. TASK_FOCUSED and CURRENT_CUE are always
  # exactly 0 regardless of this value — see ExperimentController.resolve_rho
  # (services layer, a later phase), which is the ONLY place rho is resolved
  # per condition. This file never encodes rho=0 for those two conditions;
  # that invariant lives in code, not data, so it can be tested directly.
  rho_dynamic: 0.35
  weights:
    a_mot:
      h_rel: 0.60
      stakes: 0.40
    a_info:
      h_unc: 0.45
      d_amb: 0.30
      stakes: 0.25
    a_intv:
      a_mot: 0.35
      a_info: 0.30
      d_goal: 0.20
      h_int: 0.15
      safety_risk: -0.35   # the only term that can go negative — clip() is load-bearing here only

# PolicyEngine (M6, §20.7/§20.11.1) — thresholds only. The rule PRECEDENCE
# order itself lives in policy_rules.yaml, not here.
policy_thresholds:
  safety_risk_gate: 0.70          # R_SAFETY / TF_SAFETY
  low_confidence_gate: 0.50       # R_LOW_CONF: c_t <
  low_control_gate: 0.40          # R_LOW_CTRL: h_ctrl <
  redirect:
    h_int_min: 0.65
    a_intv_min: 0.60
    a_info_min: 0.55
    c_t_min: 0.60
    safety_risk_max: 0.70
  clarify:
    h_unc_min: 0.70
    d_amb_min: 0.65
    d_goal_min: 0.65
  inform:
    a_info_min: 0.55
  acknowledge:
    h_int_min: 0.60
    h_rel_min: 0.60
    c_t_min: 0.60
  task_focused:
    safety_risk_gate: 0.70
    clarify_d_amb_min: 0.65
    clarify_d_goal_min: 0.65

# GoalState-derived hard constraints (§20.8).
goal_state:
  autonomy_high_threshold: 0.80   # autonomy_weight >= this triggers the AUTONOMY_HIGH hard constraint
